name: pr

on:
  push:
    paths-ignore:
       - '.github/project.yml'

  pull_request:
    paths-ignore:
       - '.github/project.yml'

jobs:

  main:

    strategy:
      fail-fast: false
      matrix:
        java: [ 25 ]
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}

    - run: ./mvnw clean verify -B -ntp
